<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .status-dot.speaking {
            background: #2196f3;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.listening {
            background: #ff9800;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .control-panel {
            text-align: center;
            margin-bottom: 30px;
        }

        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .mic-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .mic-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .mic-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mic-button.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 2s ease-in-out infinite;
        }

        .button-label {
            display: block;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .activity-log {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-log h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .log-entry {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 13px;
            color: #666;
        }

        .log-entry.tool-call {
            border-left-color: #4caf50;
        }

        .log-entry.error {
            border-left-color: #f44336;
            color: #f44336;
        }

        .log-entry .timestamp {
            font-size: 11px;
            color: #999;
            margin-bottom: 5px;
        }

        .log-entry .message {
            color: #333;
        }

        .audio-visualizer {
            height: 60px;
            background: #f5f5f5;
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 0 20px;
        }

        .visualizer-bar {
            width: 4px;
            height: 20px;
            background: #667eea;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .config-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .config-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .config-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 AI Voice Agent</h1>
        <p class="subtitle">Powered by OpenAI GPT-4o Realtime</p>

        <div class="error-message" id="errorMessage"></div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="connectionStatus"></div>
                <span id="connectionText">Disconnected</span>
            </div>
            <div class="status-indicator">
                <div class="status-dot" id="agentStatus"></div>
                <span id="agentStatusText">Idle</span>
            </div>
        </div>

        <div class="audio-visualizer" id="audioVisualizer">
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
        </div>

        <div class="control-panel">
            <button class="mic-button" id="micButton" disabled>🎤</button>
            <span class="button-label" id="buttonLabel">Connecting...</span>
        </div>

        <div class="activity-log">
            <h3>Activity Log</h3>
            <div id="logContainer">
                <div class="log-entry">
                    <div class="timestamp">Ready</div>
                    <div class="message">Waiting to connect...</div>
                </div>
            </div>
        </div>

        <div class="config-section">
            <input type="text" class="config-input" id="serverUrl" placeholder="WebSocket Server URL" value="ws://localhost:8000/ws/voice">
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            SAMPLE_RATE: 24000,
            CHUNK_SIZE: 480, // 20ms at 24kHz
        };

        // Global state
        let websocket = null;
        let audioContext = null;
        let mediaStream = null;
        let audioWorkletNode = null;
        let isRecording = false;
        let audioPlaybackQueue = [];
        let isPlaying = false;

        // DOM elements
        const micButton = document.getElementById('micButton');
        const buttonLabel = document.getElementById('buttonLabel');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        const agentStatus = document.getElementById('agentStatus');
        const agentStatusText = document.getElementById('agentStatusText');
        const logContainer = document.getElementById('logContainer');
        const errorMessage = document.getElementById('errorMessage');
        const serverUrlInput = document.getElementById('serverUrl');
        const visualizerBars = document.querySelectorAll('.visualizer-bar');

        // Initialize
        init();

        async function init() {
            try {
                await connectWebSocket();
            } catch (error) {
                showError('Failed to connect: ' + error.message);
                addLog('error', 'Connection failed: ' + error.message);
            }
        }

        async function connectWebSocket() {
            const serverUrl = serverUrlInput.value;
            addLog('info', 'Connecting to server...');

            websocket = new WebSocket(serverUrl);

            websocket.onopen = () => {
                addLog('info', 'Connected to server');
                updateConnectionStatus(true);
                micButton.disabled = false;
                buttonLabel.textContent = 'Click to Start';
            };

            websocket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleServerMessage(message);
            };

            websocket.onerror = (error) => {
                showError('WebSocket error');
                addLog('error', 'WebSocket error occurred');
            };

            websocket.onclose = () => {
                updateConnectionStatus(false);
                micButton.disabled = true;
                buttonLabel.textContent = 'Disconnected';
                addLog('error', 'Disconnected from server');

                // Auto-reconnect after 3 seconds
                setTimeout(() => {
                    if (websocket.readyState === WebSocket.CLOSED) {
                        addLog('info', 'Attempting to reconnect...');
                        connectWebSocket();
                    }
                }, 3000);
            };
        }

        function handleServerMessage(message) {
            const type = message.type;

            switch (type) {
                case 'session.ready':
                    addLog('info', 'Session ready: ' + message.session_id);
                    break;

                case 'audio':
                    // Play audio from agent
                    playAudioChunk(message.data);
                    break;

                case 'audio.done':
                    updateAgentStatus('idle');
                    break;

                case 'tool_call':
                    addLog('tool-call', `Tool: ${message.name}`);
                    updateAgentStatus('thinking');
                    break;

                case 'tool_result':
                    addLog('tool-call', `Tool result: ${JSON.stringify(message.result).substring(0, 100)}...`);
                    break;

                case 'agent.interrupted':
                    updateAgentStatus('listening');
                    clearAudioQueue();
                    break;

                case 'agent.listening':
                    updateAgentStatus('listening');
                    break;

                case 'response.done':
                    updateAgentStatus('idle');
                    break;

                case 'error':
                    showError(message.error);
                    addLog('error', message.error);
                    break;

                default:
                    console.log('Unknown message type:', type);
            }
        }

        micButton.addEventListener('click', async () => {
            if (!isRecording) {
                await startRecording();
            } else {
                stopRecording();
            }
        });

        async function startRecording() {
            try {
                // Request microphone access
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: CONFIG.SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Create audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: CONFIG.SAMPLE_RATE
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                const processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    if (!isRecording) return;

                    const inputData = e.inputBuffer.getChannelData(0);

                    // Convert Float32 to Int16 PCM
                    const pcmData = float32ToInt16(inputData);

                    // Convert to base64
                    const base64Audio = arrayBufferToBase64(pcmData.buffer);

                    // Send to server
                    if (websocket && websocket.readyState === WebSocket.OPEN) {
                        websocket.send(JSON.stringify({
                            type: 'audio',
                            data: base64Audio
                        }));
                    }

                    // Update visualizer
                    updateVisualizer(inputData);
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                isRecording = true;
                micButton.classList.add('active');
                buttonLabel.textContent = 'Recording... (Click to Stop)';
                updateAgentStatus('listening');
                addLog('info', 'Started recording');

            } catch (error) {
                showError('Microphone access denied: ' + error.message);
                addLog('error', 'Microphone error: ' + error.message);
            }
        }

        function stopRecording() {
            isRecording = false;

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            micButton.classList.remove('active');
            buttonLabel.textContent = 'Click to Start';
            updateAgentStatus('idle');
            addLog('info', 'Stopped recording');
            resetVisualizer();
        }

        async function playAudioChunk(base64Audio) {
            try {
                updateAgentStatus('speaking');

                // Decode base64 to ArrayBuffer
                const audioData = base64ToArrayBuffer(base64Audio);

                // Convert Int16 to Float32
                const int16Array = new Int16Array(audioData);
                const float32Array = int16ToFloat32(int16Array);

                // Create audio context if needed
                if (!audioContext || audioContext.state === 'closed') {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: CONFIG.SAMPLE_RATE
                    });
                }

                // Create audio buffer
                const audioBuffer = audioContext.createBuffer(1, float32Array.length, CONFIG.SAMPLE_RATE);
                audioBuffer.getChannelData(0).set(float32Array);

                // Create source and play
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioContext.destination);
                source.start();

            } catch (error) {
                console.error('Error playing audio:', error);
            }
        }

        function clearAudioQueue() {
            audioPlaybackQueue = [];
        }

        function updateConnectionStatus(connected) {
            if (connected) {
                connectionStatus.classList.add('connected');
                connectionText.textContent = 'Connected';
            } else {
                connectionStatus.classList.remove('connected');
                connectionText.textContent = 'Disconnected';
            }
        }

        function updateAgentStatus(status) {
            agentStatus.className = 'status-dot ' + status;

            const statusText = {
                idle: 'Idle',
                listening: 'Listening',
                thinking: 'Thinking',
                speaking: 'Speaking'
            };

            agentStatusText.textContent = statusText[status] || status;
        }

        function updateVisualizer(audioData) {
            // Calculate RMS
            const rms = Math.sqrt(audioData.reduce((sum, val) => sum + val * val, 0) / audioData.length);
            const normalized = Math.min(rms * 10, 1);

            visualizerBars.forEach((bar, index) => {
                const height = 20 + (normalized * 40 * (1 - Math.abs(index - 3.5) / 4));
                bar.style.height = height + 'px';
            });
        }

        function resetVisualizer() {
            visualizerBars.forEach(bar => {
                bar.style.height = '20px';
            });
        }

        function addLog(type, message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;

            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `
                <div class="timestamp">${timestamp}</div>
                <div class="message">${message}</div>
            `;

            logContainer.insertBefore(entry, logContainer.firstChild);

            // Keep only last 20 entries
            while (logContainer.children.length > 20) {
                logContainer.removeChild(logContainer.lastChild);
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        // Utility functions
        function float32ToInt16(float32Array) {
            const int16Array = new Int16Array(float32Array.length);
            for (let i = 0; i < float32Array.length; i++) {
                const s = Math.max(-1, Math.min(1, float32Array[i]));
                int16Array[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return int16Array;
        }

        function int16ToFloat32(int16Array) {
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / (int16Array[i] < 0 ? 0x8000 : 0x7FFF);
            }
            return float32Array;
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }
    </script>
</body>
</html>
